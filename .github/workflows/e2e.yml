name: E2E
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -o otg ./cmd/otg/

      - name: E2E — task workflow
        run: |
          set -euo pipefail
          VAULT=$(mktemp -d)
          mkdir -p "$VAULT/Tasks" "$VAULT/Requirements"

          # Create requirement
          cat > "$VAULT/Requirements/REQ-001-e2e.md" << 'EOF'
          ---
          id: "001"
          title: E2E Test
          priority: P0
          project: e2e-test
          ---
          ## 要做什么
          E2E validation of task processing.
          ## 完成标准
          - [ ] Works
          EOF

          # Create task manually (simulating on_req_changed)
          cat > "$VAULT/Tasks/TASK-001-e2e.md" << 'TASKEOF'
          ---
          id: "001"
          title: "E2E Test"
          project: "e2e-test"
          status: ready
          plan_approved: false
          merge_approved: false
          plan_version: 0
          assignee: "deepseek"
          req_doc: "Requirements/REQ-001-e2e.md"
          created: "2026-07-10T00:00:00+08:00"
          updated: "2026-07-10T00:00:00+08:00"
          completed: ""
          ---
          # E2E Test Task

          ## 执行摘要
          | 轮次 | 阶段 | 计划版本 | 状态 | 时间戳 |
          |------|------|---------|------|--------|
          | 1 | Round 1 | v1 | ⏳ 待开始 | — |

          ## 实现计划
          ### v1 · 2026-07-10

          ## 实现记录
          ### Round 1 · 2026-07-10

          ## 验收记录
          ### Round 1 · 2026-07-10

          ## 变更记录
          1. `2026-07-10T00:00:00+08:00` — 任务创建，等待就绪
          TASKEOF

          # Test update-status → plan-review
          ./otg update-status "$VAULT/Tasks/TASK-001-e2e.md" status=plan-review plan_version=1
          grep -q 'status: plan-review' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: status not updated"; exit 1; }
          grep -q 'plan_version: 1' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: plan_version not updated"; exit 1; }

          # Test update-status → closed
          ./otg update-status "$VAULT/Tasks/TASK-001-e2e.md" status=closed closure_reason=cancelled
          grep -q 'status: closed' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: status not updated to closed"; exit 1; }
          grep -q 'closure_reason: cancelled' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: closure_reason not set"; exit 1; }

          # Reset to ready for done test
          ./otg update-status "$VAULT/Tasks/TASK-001-e2e.md" status=done merge_approved=false
          grep -q 'status: done' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: status not updated to done"; exit 1; }
          grep -q 'merge_approved: false' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: merge_approved not set"; exit 1; }

          # Verify timestamp was auto-set
          grep -q 'updated: "' "$VAULT/Tasks/TASK-001-e2e.md" || { echo "FAIL: updated timestamp missing"; exit 1; }

          echo "E2E task workflow PASS"

      - name: E2E — mock OMP skill transitions
        env:
          OMP_CMD: test/e2e/fake-omp.sh
        run: |
          set -euo pipefail
          VAULT=$(mktemp -d)
          LOG_DIR=$(mktemp -d)
          SKILL_DIR=$(mktemp -d)
          mkdir -p "$SKILL_DIR/config" "$VAULT/Tasks" "$VAULT/Requirements"

          # Create a minimal requirement doc
          cat > "$VAULT/Requirements/REQ-002-mock.md" << 'EOF'
          ---
          id: "002"
          title: Mock OMP E2E
          ---
          ## 要做什么
          Test automated phase transitions via fake-omp.sh.
          ## 完成标准
          - [ ] Transition refining→planning via maturity gate
          EOF

          # Create task with status=refining (requires assignee + req_doc for IsReady)
          cat > "$VAULT/Tasks/TASK-002-mock.md" << 'TASKEOF'
          ---
          id: "002"
          title: "Mock OMP Skill Transitions"
          project: "e2e-test"
          status: refining
          plan_approved: false
          merge_approved: false
          plan_version: 0
          assignee: "default"
          maturity: ""
          refine_version: 0
          req_doc: "Requirements/REQ-002-mock.md"
          created: "2026-07-28T00:00:00+08:00"
          updated: "2026-07-28T00:00:00+08:00"
          ---
          # Mock OMP Task
          TASKEOF

          # Build minimal vault-map config so daemon can resolve the model
          cat > "$SKILL_DIR/config/vault-map.json" << MAPEOF
          {
            "obsidian_vault": "$VAULT",
            "omp_cmd": "test/e2e/fake-omp.sh",
            "projects": [{"name": "e2e-test", "path": "$VAULT"}],
            "models": {"default": "d"},
            "notifications": {"desktop": false}
          }
          MAPEOF

          # daemon --once runs up to 3 rounds (3s sleeps between re-scans).
          # Starting at refining:
          #   Round 1: fake-omp (refining skill) -> maturity=fully_mature, status=planning
          #   Round 2: fake-omp (planning skill) -> plan_version bump, status=plan-review
          #   Round 3: plan-review without plan_approved -> not ready, no-op
          OMP_CMD=test/e2e/fake-omp.sh ./otg daemon --once \
            --map-file "$SKILL_DIR/config/vault-map.json" \
            --skill-dir "$SKILL_DIR" \
            --log-dir "$LOG_DIR" 2>&1 || true

          TASK="$VAULT/Tasks/TASK-002-mock.md"

          echo "=== Final state ==="
          grep -E '^status:|^maturity:|^plan_version:|^refine_version:' "$TASK"

          # Verify the refining->planning transition occurred
          if grep -q 'maturity: fully_mature' "$TASK"; then
            echo "PASS: maturity=fully_mature (refining skill ran)"
          else
            echo "FAIL: maturity not set -- refining skill may not have run"
            exit 1
          fi

          # Verify the task left refining (either planning or further)
          STATUS=$(grep '^status:' "$TASK" | sed 's/status: *//' | tr -d '"')
          if [ "$STATUS" != "refining" ]; then
            echo "PASS: status=$STATUS (transitioned from refining)"
          else
            echo "FAIL: still at refining -- no transition"
            exit 1
          fi

          # Verify plan_version was bumped (planning skill ran after refining)
          PV=$(grep '^plan_version:' "$TASK" | sed 's/plan_version: *//' | tr -d ' ')
          if [ "$PV" -ge 1 ]; then
            echo "PASS: plan_version=$PV (planning skill ran)"
          else
            echo "FAIL: plan_version not bumped"
            exit 1
          fi

          # Verify refine_version was also bumped (refining skill audit trail)
          RV=$(grep '^refine_version:' "$TASK" | sed 's/refine_version: *//' | tr -d ' ')
          if [ "$RV" -ge 1 ]; then
            echo "PASS: refine_version=$RV (refining audit trail)"
          else
            echo "FAIL: refine_version not bumped"
            exit 1
          fi

          echo ""
          echo "Mock OMP transitions PASS"

      - name: E2E — CLI smoke tests
        run: |
          ./otg config show --json 2>&1 | grep -q '"key"' || { echo "FAIL: config show"; exit 1; }
          echo "config show PASS"

          ./otg status --json 2>&1 | grep -q '"lock_status"' || { echo "FAIL: status --json"; exit 1; }
          echo "status PASS"

          ./otg review /nonexistent 2>&1 | grep -q "parse\|no such file" || { echo "FAIL: review error handling"; exit 1; }
          echo "review error handling PASS"

      - name: E2E — install dry-run
        run: |
          ./otg install --dry-run 2>&1 | grep -q "DRY RUN" || { echo "FAIL: install --dry-run"; exit 1; }
          echo "install dry-run PASS"
