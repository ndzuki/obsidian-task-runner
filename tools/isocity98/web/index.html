<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2312121a'/%3E%3Cpath d='M8 3l6 3-6 3-6-3z' fill='%232fbfb0'/%3E%3C/svg%3E">
<title>ISO-CITY '98 — 等距城市建造沙盒</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05060a; color: #9ba1ae;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", monospace;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  /* 内部帧缓冲固定 640x400（PC-98 分辨率），靠整数倍最近邻放大铺满窗口 */
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    background: #05060a;
    cursor: crosshair;
  }
  #boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: #05060a;
    font-family: ui-monospace, monospace; font-size: 13px; letter-spacing: .08em;
    color: #7ba0bb; transition: opacity .35s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot .logo {
    color: #c9cdd7; font-size: 26px; letter-spacing: .3em; text-shadow: 2px 2px 0 #1d1e2a;
  }
  #boot .bar { width: 260px; height: 12px; border: 1px solid #35384c; padding: 1px; }
  #boot .bar > i { display: block; height: 100%; width: 0%; background: #2fbfb0; }
  #boot .err { color: #d07f60; max-width: 70ch; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="400"></canvas></div>
<div id="boot">
  <div class="logo">ISO-CITY '98</div>
  <div>PRE-RENDERED ISOMETRIC CITY SANDBOX</div>
  <div class="bar"><i id="bootbar"></i></div>
  <div id="bootmsg">loading sprite atlas…</div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
