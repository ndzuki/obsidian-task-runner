<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Town · 现代工作流小镇</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --panel: #121722;
    --panel-2: #1a2232;
    --border: #263149;
    --text: #e6ecf6;
    --dim: #8996ab;
    --accent: #5eead4;
    --blue: #38bdf8;
    --purple: #a78bfa;
    --pink: #f472b6;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --orange: #fb923c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }

  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 14px;
    padding: 14px 20px; background: rgba(18,23,34,.86);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .04em; font-size: 18px; }
  .brand .logo { font-size: 22px; }
  .brand .sub { color: var(--dim); font-size: 12px; font-weight: 500; margin-left: 4px; }
  .stats { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    border: 1px solid var(--border); background: var(--panel);
    border-radius: 999px; padding: 5px 12px; color: var(--dim); font-size: 12.5px;
  }
  .stat b { color: var(--text); font-weight: 700; }
  .stat.live b { color: var(--green); }
  .legend {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px;
    border-bottom: 1px solid var(--border); background: rgba(12,16,24,.6);
  }
  .legend span { color: var(--dim); font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .legend b { color: var(--text); }

  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px; padding: 16px 20px 30px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }

  .town-panel {
    background: linear-gradient(180deg, #101a2e 0%, #0d1420 100%);
    border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
    position: relative; min-height: 560px;
  }
  .town {
    position: relative; width: 100%; height: clamp(520px, 68vh, 760px);
    overflow: hidden;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(56,189,248,.16), transparent 60%),
      linear-gradient(180deg, #0e1728 0%, #131d2e 45%, #1b2836 46%, #101923 100%);
  }
  .skyline {
    position: absolute; left: 0; right: 0; top: 0; height: 42%;
    background:
      radial-gradient(2px 2px at 12% 28%, #fef3c7, transparent 1.5px),
      radial-gradient(1.5px 1.5px at 24% 15%, #e2e8f0, transparent 1px),
      radial-gradient(2px 2px at 38% 32%, #fef3c7, transparent 1.5px),
      radial-gradient(1px 1px at 52% 12%, #e2e8f0, transparent 1px),
      radial-gradient(2px 2px at 64% 25%, #fef3c7, transparent 1.5px),
      radial-gradient(1.5px 1.5px at 78% 18%, #e2e8f0, transparent 1px),
      radial-gradient(2px 2px at 88% 30%, #fef3c7, transparent 1.5px);
    opacity: .8;
  }
  .skyline::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 48%;
    background:
      linear-gradient(135deg, transparent 0 12%, rgba(30,41,59,.9) 12% 20%, transparent 20% 32%, rgba(30,41,59,.85) 32% 42%, transparent 42% 54%, rgba(30,41,59,.9) 54% 66%, transparent 66% 78%, rgba(30,41,59,.85) 78% 88%, transparent 88%),
      linear-gradient(90deg, rgba(15,23,42,.9), rgba(15,23,42,.9));
    clip-path: polygon(0 55%, 4% 30%, 9% 55%, 15% 20%, 22% 55%, 28% 35%, 35% 55%, 44% 10%, 52% 55%, 60% 28%, 67% 55%, 74% 18%, 81% 55%, 89% 34%, 100% 55%, 100% 100%, 0 100%);
  }
  .road {
    position: absolute; left: -4%; right: -4%; top: 47%; height: 90px;
    background: #252f45; border-top: 2px solid #303c56; border-bottom: 2px solid #303c56;
    transform: rotate(-2deg); box-shadow: 0 8px 18px rgba(0,0,0,.35);
  }
  .road::before, .road::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background: repeating-linear-gradient(90deg, #facc15 0 26px, transparent 26px 54px);
    opacity: .55;
  }
  .road::after { top: 12px; }
  .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 44%; background: linear-gradient(180deg, #172336, #101923); }

  .station {
    position: absolute; transform: translate(-50%, -50%);
    width: 112px; padding: 8px 6px 6px; text-align: center;
    background: linear-gradient(180deg, var(--panel-2), #111827);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
    z-index: 2;
  }
  .station .icon { font-size: 24px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .station .label { margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--text); }
  .station .hint { font-size: 10px; color: var(--dim); margin-top: 1px; }
  .station.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(94,234,212,.15), 0 10px 30px rgba(0,0,0,.5); }

  .agents { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .agent {
    position: absolute; width: 110px; height: 132px;
    transform: translate(-50%, -78%); pointer-events: auto;
    transition: left 1.1s cubic-bezier(.22,.8,.32,1), top 1.1s cubic-bezier(.22,.8,.32,1);
    cursor: pointer; user-select: none;
  }
  .agent .body {
    position: absolute; left: 50%; top: 30px; transform: translateX(-50%);
    width: 48px; height: 58px; border-radius: 24px 24px 14px 14px;
    background: linear-gradient(180deg, var(--c) 0%, color-mix(in srgb, var(--c) 55%, #0b0e14) 100%);
    box-shadow: 0 8px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .agent .head {
    position: absolute; left: 50%; top: 4px; transform: translateX(-50%);
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(180deg, #f8d7b0, #e7b98d);
    border: 2px solid rgba(255,255,255,.18);
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .agent .face {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    font-size: 18px; line-height: 1; z-index: 2;
  }
  .agent .bubble {
    position: absolute; left: 50%; top: -38px; transform: translateX(-50%);
    min-width: 94px; max-width: 150px; background: rgba(10,15,26,.92);
    border: 1px solid var(--border); color: var(--text); border-radius: 12px;
    padding: 4px 8px; font-size: 11px; text-align: center; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,.45); opacity: 0; transition: opacity .3s;
  }
  .agent .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--border); border-bottom: 0;
  }
  .agent .tag {
    position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
    background: rgba(8,12,20,.88); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; font-size: 10.5px;
    color: var(--text); white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.35);
  }
  .agent .task {
    position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%);
    max-width: 150px; color: var(--dim); font-size: 10.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  .agent .symbol {
    position: absolute; left: 50%; top: -72px; transform: translateX(-50%);
    font-size: 20px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); opacity: 0;
    transition: opacity .25s, transform .25s;
  }
  .agent.visible .bubble { opacity: 1; }
  .agent.visible .symbol { opacity: 1; animation: floaty 2.2s ease-in-out infinite; }
  .agent.working .body { animation: work 1.1s ease-in-out infinite; }
  .agent.idle .face { animation: sleepy 2.8s ease-in-out infinite; }
  .agent.jumping .body { animation: jump .55s ease; }
  @keyframes work { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-3px) rotate(2deg); } }
  @keyframes sleepy { 0%,100% { opacity: 1; transform: rotate(0); } 50% { opacity: .75; transform: rotate(-8deg); } }
  @keyframes floaty { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -6px); } }
  @keyframes jump { 0% { transform: translateY(0); } 45% { transform: translateY(-22px); } 100% { transform: translateY(0); } }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(94,234,212,.5); }
    100% { box-shadow: 0 0 0 16px rgba(94,234,212,0); }
  }
  .agent.working .head { animation: pulse-ring 1.8s infinite; }
  .agent .heart {
    position: absolute; left: 50%; top: -10px; font-size: 18px; opacity: 0; pointer-events: none;
  }
  .agent .heart.show { animation: heartUp 1s ease-out forwards; }
  @keyframes heartUp { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50px) scale(1.3); } }

  #empty {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(8,12,20,.86); border: 1px solid var(--border); color: var(--dim);
    border-radius: 999px; padding: 7px 18px; z-index: 8; font-size: 13px;
  }

  .side { display: flex; flex-direction: column; gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; min-height: 0; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .roster { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
  .roster-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
  }
  .roster-item:hover { border-color: var(--accent); }
  .roster-item .ava { width: 34px; height: 34px; flex: 0 0 34px; display: grid; place-items: center; border-radius: 10px; background: rgba(255,255,255,.05); font-size: 18px; }
  .roster-item .info { min-width: 0; flex: 1; }
  .roster-item .name { font-weight: 700; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .roster-item .dot { width: 7px; height: 7px; border-radius: 50%; }
  .roster-item .task { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roster-item .meta { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
  .empty { color: var(--dim); text-align: center; padding: 22px 8px; font-size: 13px; }

  .log { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; }
  .log-item { font-size: 12px; color: var(--dim); border-left: 2px solid var(--border); padding: 2px 0 2px 10px; }
  .log-item b { color: var(--text); }
  .log-item .time { color: #5b6b85; font-size: 10px; margin-right: 6px; }

  #detail {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none;
    width: min(420px, calc(100vw - 32px)); background: #10151f; border: 1px solid var(--border);
    border-radius: 18px; box-shadow: 0 24px 80px rgba(0,0,0,.65); z-index: 80; padding: 20px;
    transition: opacity .2s, transform .2s;
  }
  #detail.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #detail .d-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  #detail .d-ava { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; background: var(--panel-2); border: 1px solid var(--border); }
  #detail .d-title { font-weight: 800; font-size: 17px; }
  #detail .d-sub { color: var(--dim); font-size: 12px; word-break: break-all; }
  #detail .d-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06251f; font-weight: 700; }
  .btn.close { margin-left: auto; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 5px 10px; font-size: 12.5px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; color: var(--text); word-break: break-word; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #0d1420; border: 1px solid var(--accent); color: var(--text);
    padding: 8px 18px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 90;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">🏙️</span>AGENT TOWN <span class="sub">现代工作流小镇 · 实时居民观察</span></div>
  <div class="stats">
    <span class="stat live">活跃 <b id="count">0</b></span>
    <span class="stat">今日完工 <b id="finished">0</b></span>
    <span class="stat">时间 <b id="clock">--:--</b></span>
  </div>
</header>
<div class="legend">
  <span>📖 需求精炼</span><span>🗺️ 方案规划</span><span>📋 计划评审</span><span>🛠️ 实现建造</span>
  <span>🔍 验收</span><span>🚀 合并</span><span>🕵️ 审计</span><span>💬 统筹/问答</span>
  <span>🎨 设计</span><span>✂️ 拆分</span><span>🚧 阻塞</span><span>🏆 完成</span>
  <span><b>💡 点击居民可查看任务并给予鼓励</b></span>
</div>
<main class="layout">
  <section class="town-panel">
    <div class="town" id="town">
      <div class="skyline"></div>
      <div class="road"></div>
      <div class="grass"></div>
      <div id="stations"></div>
      <div class="agents" id="agents"></div>
      <div id="empty">🌆 小镇空闲 — 等待 agent 上工…</div>
    </div>
  </section>
  <aside class="side">
    <div class="panel">
      <h3>🧑‍🤝‍🧑 在镇居民</h3>
      <div class="roster" id="roster"><div class="empty">暂无 agent</div></div>
    </div>
    <div class="panel">
      <h3>📡 小镇动态</h3>
      <div class="log" id="log"><div class="empty">等待第一条动态…</div></div>
    </div>
  </aside>
</main>

<div id="detail">
  <div class="d-head">
    <div class="d-ava" id="dAva">🤖</div>
    <div>
      <div class="d-title" id="dTitle">Agent</div>
      <div class="d-sub" id="dSub">session</div>
    </div>
  </div>
  <dl class="kv" id="dKv"></dl>
  <div class="d-actions">
    <button class="btn primary" id="dCheer">💗 加油</button>
    <button class="btn" id="dLocate">📍 定位</button>
    <button class="btn close" id="dClose">关闭</button>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================================
 * Agent Town —— 现代风 RPG 工作流小镇
 *
 * 从 agent-server /agents 轮询活跃 agent 会话，把每个 agent 渲染成小镇居民。
 * 不同阶段/状态映射到不同工位、动作表情、符号与气泡：
 *   refining/planning/plan-review/implementing/review/merge/audit/pm/design/
 *   split/blocked/done/idle 等。
 *
 * 交互：
 *   - 点击居民 → 打开详情面板（阶段、任务、时长、项目）
 *   - “加油” → 爱心飘起 + toast；“定位” → 闪烁该居民
 *   - 右侧动态列表记录居民阶段切换
 * ========================================================================== */

const POLL_MS = 2000;

/* 阶段/状态 → 小镇语义 */
const STAGE = {
  refining: {
    label: '需求精炼', station: '图书馆', icon: '📖', emoji: '🤔', symbol: '📚',
    action: '研读需求', color: '#a78bfa', bubble: '让我先读清楚需求…'
  },
  planning: {
    label: '方案规划', station: '规划院', icon: '🗺️', emoji: '🧠', symbol: '🗺️',
    action: '绘制路线', color: '#38bdf8', bubble: '正在推演最优路径…'
  },
  'plan-review': {
    label: '计划评审', station: '评审台', icon: '📋', emoji: '🧐', symbol: '⚖️',
    action: '核对计划', color: '#facc15', bubble: '计划有没有漏洞？'
  },
  implementing: {
    label: '实现建造', station: '工坊', icon: '🛠️', emoji: '👷', symbol: '🔨',
    action: '敲码建造', color: '#3b82f6', bubble: '动手实现中！'
  },
  review: {
    label: '验收检查', station: '质检站', icon: '🔍', emoji: '🔎', symbol: '🛡️',
    action: '逐条验收', color: '#4ade80', bubble: '逐条核对 AC…'
  },
  merge: {
    label: '合并交付', station: '发布港', icon: '🚀', emoji: '🚀', symbol: '🔀',
    action: '合并发布', color: '#06b6d4', bubble: '准备打包发布！'
  },
  audit: {
    label: '独立审计', station: '审计所', icon: '🕵️', emoji: '🕵️', symbol: '📜',
    action: '独立复核', color: '#fb923c', bubble: '再独立检查一遍…'
  },
  priority: {
    label: '优先级', station: '调度塔', icon: '🚩', emoji: '⚖️', symbol: '🚩',
    action: '排定优先级', color: '#f87171', bubble: '这个该先做！'
  },
  pm: {
    label: '统筹问答', station: '议事广场', icon: '💬', emoji: '💬', symbol: '🗣️',
    action: '访谈统筹', color: '#f472b6', bubble: '来聊聊需求和决策…'
  },
  design: {
    label: '设计蓝图', station: '设计室', icon: '🎨', emoji: '🎨', symbol: '📐',
    action: '绘制蓝图', color: '#c084fc', bubble: '把架构画出来…'
  },
  split: {
    label: '任务拆分', station: '拆解坊', icon: '✂️', emoji: '✂️', symbol: '🧩',
    action: '拆分任务', color: '#14b8a6', bubble: '拆成可执行小块…'
  },
  conflict: {
    label: '冲突处理', station: '仲裁厅', icon: '⚔️', emoji: '⚔️', symbol: '🛠️',
    action: '解决冲突', color: '#f43f5e', bubble: '有冲突，需要仲裁…'
  },
  blocked: {
    label: '阻塞等待', station: '候车亭', icon: '🚧', emoji: '🥶', symbol: '⛔',
    action: '等待解除', color: '#ef4444', bubble: '被卡住了，等待…'
  },
  'needs-grilling': {
    label: '待访谈', station: '议事广场', icon: '💬', emoji: '🤷', symbol: '❓',
    action: '等待需求访谈', color: '#facc15', bubble: '这里还不清楚…'
  },
  done: {
    label: '已完成', station: '光荣广场', icon: '🏆', emoji: '🎉', symbol: '✅',
    action: '交付庆祝', color: '#84cc16', bubble: '完成！交付成果！'
  },
  closed: {
    label: '已关闭', station: '归档库', icon: '🗄️', emoji: '📦', symbol: '🔒',
    action: '归档封存', color: '#475569', bubble: '任务已归档…'
  },
  ready: {
    label: '待命出发', station: '车站', icon: '🚉', emoji: '🧳', symbol: '🕐',
    action: '等待派发', color: '#94a3b8', bubble: '随时准备出发！'
  },
  conventions: {
    label: '规范审查', station: '规范所', icon: '📜', emoji: '📏', symbol: '📜',
    action: '检查规范', color: '#34d399', bubble: '按规范逐条对照…'
  },
  knowledge: {
    label: '知识归档', station: '知识馆', icon: '📚', emoji: '🧠', symbol: '📚',
    action: '提炼知识', color: '#60a5fa', bubble: '把经验沉淀成知识…'
  },
  idle: {
    label: '休息', station: '咖啡角', icon: '☕', emoji: '😴', symbol: '☕',
    action: '恢复体力', color: '#64748b', bubble: '暂无任务，休息中…'
  },
  working: {
    label: '工作中', station: '中心街道', icon: '⚙️', emoji: '🔧', symbol: '⚙️',
    action: '执行中', color: '#94a3b8', bubble: '正在忙碌…'
  }
};

/* 每个工位在小镇画布中的坐标（百分比） */
const STATION_POS = {
  refining:     { x: 10, y: 24 },
  planning:     { x: 27, y: 19 },
  'plan-review':{ x: 44, y: 17 },
  implementing: { x: 62, y: 22 },
  review:       { x: 80, y: 20 },
  merge:        { x: 93, y: 34 },
  priority:     { x: 7,  y: 60 },
  pm:           { x: 25, y: 63 },
  design:       { x: 43, y: 61 },
  split:        { x: 60, y: 63 },
  audit:        { x: 76, y: 62 },
  blocked:      { x: 90, y: 62 },
  done:         { x: 96, y: 48 },
  closed:       { x: 96, y: 42 },
  ready:        { x: 50, y: 33 },
  conventions:  { x: 14, y: 80 },
  knowledge:    { x: 38, y: 80 },
  idle:         { x: 50, y: 82 },
  conflict:     { x: 68, y: 49 },
  'needs-grilling': { x: 25, y: 63 },
  working:      { x: 50, y: 40 }
};

const $ = (s) => document.querySelector(s);
const agentsEl = $('#agents');
const rosterEl = $('#roster');
const logEl = $('#log');
const emptyEl = $('#empty');

let agents = new Map();   // sessionId -> { element, meta, data }
let lastStage = new Map();
let finishedCount = 0;
let toastTimer = null;
let selectedId = null;
let agentsConnected = false;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtElapsed(sec) {
  sec = Number(sec || 0);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if (h > 0) return h + 'h' + (m > 0 ? m + 'm' : '');
  if (m > 0) return m + 'm' + s + 's';
  return s + 's';
}

function stageKey(a) {
  const ts = String(a.taskStatus || '').trim();
  const ph = String(a.phase || '').trim();
  const map = {
    'round1': 'planning', 'round2': 'implementing', 'plan_review': 'plan-review',
    'plan-review': 'plan-review', 'needs-grilling': 'needs-grilling'
  };
  if (ts) {
    if (map[ts]) return map[ts];
    if (STAGE[ts]) return ts;
  }
  if (ph) {
    if (map[ph]) return map[ph];
    if (STAGE[ph]) return ph;
  }
  if (a.status === 'idle') return 'idle';
  return 'working';
}

function shortSession(sid) {
  if (!sid) return 'agent';
  if (sid.startsWith('session-')) return sid.slice(8, 14);
  return sid.slice(0, 6);
}

function buildStations() {
  const seen = new Set();
  const html = [];
  for (const key in STAGE) {
    const meta = STAGE[key];
    const pos = STATION_POS[key];
    if (!pos || seen.has(meta.station)) continue;
    seen.add(meta.station);
    html.push(
      '<div class="station" data-station="' + esc(key) + '" style="left:' + pos.x + '%;top:' + pos.y + '%">' +
        '<div class="icon">' + meta.icon + '</div>' +
        '<div class="label">' + esc(meta.station) + '</div>' +
        '<div class="hint">' + esc(meta.action) + '</div>' +
      '</div>'
    );
  }
  $('#stations').innerHTML = html.join('');
}

function ensureAgent(sid, data) {
  let entry = agents.get(sid);
  if (entry) {
    entry.data = data;
    return entry;
  }
  const meta = STAGE[stageKey(data)] || STAGE.working;
  const el = document.createElement('div');
  el.className = 'agent';
  el.innerHTML =
    '<div class="symbol">' + meta.symbol + '</div>' +
    '<div class="bubble"></div>' +
    '<div class="heart">💗</div>' +
    '<div class="head"><span class="face"></span></div>' +
    '<div class="body"></div>' +
    '<div class="tag"></div>' +
    '<div class="task"></div>';
  el.addEventListener('click', () => showDetail(sid));
  agentsEl.appendChild(el);
  entry = { el, data, sid };
  agents.set(sid, entry);
  lastStage.set(sid, stageKey(data));
  logEvent('👋', data, '进入小镇');
  return entry;
}

function updateAgent(sid, data) {
  const entry = ensureAgent(sid, data);
  const el = entry.el;
  const key = stageKey(data);
  const meta = STAGE[key] || STAGE.working;
  const pos = STATION_POS[key] || STATION_POS.working;

  // 阶段性切换记录
  const prev = lastStage.get(sid);
  if (prev !== key) {
    lastStage.set(sid, key);
    if (prev) logEvent('🔀', data, STAGE[prev]?.label + ' → ' + meta.label);
  }

  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  el.style.setProperty('--c', meta.color);
  el.classList.toggle('working', data.status !== 'idle');
  el.classList.toggle('idle', data.status === 'idle' || key === 'idle');
  el.classList.add('visible');
  el.dataset.session = sid;
  el.dataset.stage = key;

  el.querySelector('.symbol').textContent = meta.symbol;
  el.querySelector('.face').textContent = meta.emoji;
  el.querySelector('.bubble').textContent = meta.bubble;
  el.querySelector('.tag').textContent = (data.status === 'idle' ? '☕ ' : '') + meta.label;
  const task = String(data.task || '').split('\n')[0] || '未知任务';
  el.querySelector('.task').textContent = task.length > 18 ? task.slice(0, 17) + '…' : task;
  el.title = meta.label + ' · ' + task;
}

function removeAgent(sid) {
  const entry = agents.get(sid);
  if (!entry) return;
  logEvent('👋', entry.data, '离开小镇');
  entry.el.remove();
  agents.delete(sid);
  lastStage.delete(sid);
  if (selectedId === sid) closeDetail();
}

function renderRoster() {
  const items = Array.from(agents.values()).sort((a, b) => a.el.dataset.stage.localeCompare(b.el.dataset.stage));
  if (!items.length) {
    rosterEl.innerHTML = '<div class="empty">暂无 agent</div>';
    return;
  }
  rosterEl.innerHTML = items.map(({ el, data }) => {
    const key = el.dataset.stage || 'working';
    const meta = STAGE[key] || STAGE.working;
    const task = String(data.task || '').split('\n')[0] || '未知任务';
    return '<div class="roster-item" data-sid="' + esc(data.sessionId) + '" onclick="showDetail(\'' + esc(data.sessionId) + '\')">' +
      '<div class="ava">' + meta.icon + '</div>' +
      '<div class="info">' +
        '<div class="name"><span class="dot" style="background:' + meta.color + '"></span>' + esc(meta.label) + ' · ' + esc(shortSession(data.sessionId)) + '</div>' +
        '<div class="task">' + esc(task) + '</div>' +
        '<div class="meta">' + esc(data.status === 'idle' ? '休息中' : '工作中') + ' · ' + esc(fmtElapsed(data.elapsed)) + (data.project ? ' · ' + esc(data.project) : '') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function logEvent(icon, data, text) {
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const div = document.createElement('div');
  div.className = 'log-item';
  div.innerHTML = '<span class="time">' + time + '</span>' + icon + ' <b>' + esc(shortSession(data.sessionId)) + '</b> ' + esc(text);
  logEl.prepend(div);
  while (logEl.children.length > 30) logEl.lastChild.remove();
  if (logEl.querySelector('.empty')) logEl.querySelector('.empty').remove();
}

function updateEmpty() {
  if (agents.size > 0) {
    emptyEl.style.display = 'none';
  } else {
    emptyEl.style.display = '';
    emptyEl.textContent = agentsConnected
      ? '🌆 小镇空闲 — 等待 agent 上工…'
      : '📡 Agent server 未连接，请确认 dsh-agent-server.service 正在运行';
  }
}

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function showDetail(sid) {
  const entry = agents.get(sid);
  if (!entry) return;
  selectedId = sid;
  const data = entry.data;
  const key = stageKey(data);
  const meta = STAGE[key] || STAGE.working;
  $('#dAva').textContent = meta.icon;
  $('#dTitle').textContent = meta.label + ' · ' + shortSession(sid);
  $('#dSub').textContent = data.sessionId || '';
  const task = String(data.task || '').split('\n')[0] || '未知任务';
  $('#dKv').innerHTML =
    '<dt>阶段</dt><dd>' + esc(meta.label) + ' ' + meta.emoji + ' ' + esc(data.phase || '') + '</dd>' +
    '<dt>任务</dt><dd>' + esc(task) + '</dd>' +
    '<dt>项目</dt><dd>' + esc(data.project || '—') + '</dd>' +
    '<dt>状态</dt><dd>' + esc(data.status === 'idle' ? '休息' : '工作中') + '</dd>' +
    '<dt>时长</dt><dd>' + esc(fmtElapsed(data.elapsed)) + '</dd>' +
    '<dt>动作</dt><dd>' + esc(meta.action) + ' ' + meta.symbol + '</dd>';
  $('#detail').classList.add('show');
}

function closeDetail() {
  selectedId = null;
  $('#detail').classList.remove('show');
}

function cheer(sid) {
  const entry = agents.get(sid);
  if (!entry) return;
  const heart = entry.el.querySelector('.heart');
  heart.classList.remove('show');
  void heart.offsetWidth;
  heart.classList.add('show');
  showToast('💗 已给 ' + shortSession(sid) + ' 加油！');
}

function locate(sid) {
  const entry = agents.get(sid);
  if (!entry) return;
  entry.el.classList.remove('jumping');
  void entry.el.offsetWidth;
  entry.el.classList.add('jumping');
  closeDetail();
}

function activateStation(key) {
  const meta = STAGE[key];
  if (!meta) return;
  document.querySelectorAll('.station').forEach(el => {
    const label = el.querySelector('.label');
    if (label && label.textContent === meta.station) el.classList.add('active');
  });
}

async function poll() {
  try {
    const resp = await fetch('/agents');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    finishedCount = parseInt(resp.headers.get('x-agents-finished') || '0', 10) || 0;
    const list = await resp.json();
    agentsConnected = true;
    updateEmpty();

    const seen = new Set();
    const countByStage = {};

    for (const a of Array.isArray(list) ? list : []) {
      seen.add(a.sessionId);
      updateAgent(a.sessionId, a);
      const key = stageKey(a);
      countByStage[key] = (countByStage[key] || 0) + 1;
    }

    // 移除已离开的 agent
    for (const sid of Array.from(agents.keys())) {
      if (!seen.has(sid)) removeAgent(sid);
    }

    // 激活有人的工位
    document.querySelectorAll('.station').forEach(el => el.classList.remove('active'));
    for (const key in countByStage) activateStation(key);

    $('#count').textContent = String(agents.size);
    $('#finished').textContent = String(finishedCount);
    renderRoster();
  } catch (e) {
    agentsConnected = false;
    updateEmpty();
  }
}

function clock() {
  const d = new Date();
  $('#clock').textContent = d.toLocaleTimeString('zh-CN', { hour12: false });
}

/* 初始化 */
buildStations();
clock();
setInterval(clock, 1000);
poll();
setInterval(poll, POLL_MS);

/* 详情面板事件 */
$('#dCheer').addEventListener('click', () => { if (selectedId) cheer(selectedId); });
$('#dLocate').addEventListener('click', () => { if (selectedId) locate(selectedId); });
$('#dClose').addEventListener('click', closeDetail);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });
</script>
</body>
</html>
